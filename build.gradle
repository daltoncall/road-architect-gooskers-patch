plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.shedaniel.me/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    implementation "com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}"
    include "com.github.ben-manes.caffeine:caffeine:${project.caffeine_version}"
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'cloth_config_version', project.cloth_config_version
    inputs.property 'modmenu_version', project.modmenu_version

    filesMatching('fabric.mod.json') {
        expand(
                version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version,
                cloth_config_version: project.cloth_config_version,
                modmenu_version: project.modmenu_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17
}

java {
    toolchain {
        // Loom 1.11 runs on Java 21; --release below keeps the mod Java 17 compatible.
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

tasks.withType(Jar).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

remapJar {
    archiveFileName = "Road-Architect-Gooskers-Patch-${project.version}.jar"
}

// No additional test dependencies: run the checks against the actual mod utility.
tasks.register('postLoadRegressionChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.oxcodsnet.roadarchitect.util.PostLoadRegressionChecks'
}
check.dependsOn postLoadRegressionChecks

// These are executable checks, rather than a JUnit suite.
test {
    dependsOn postLoadRegressionChecks
    failOnNoDiscoveredTests = false
}

tasks.register('performanceRegressionChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.oxcodsnet.roadarchitect.util.PerformanceRegressionChecks'
}
check.dependsOn performanceRegressionChecks
test.dependsOn performanceRegressionChecks

loom { mixin { useLegacyMixinAp = true; defaultRefmapName = "roadarchitect.tree-protection.refmap.json" } }

tasks.register('treeRegressionChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.oxcodsnet.roadarchitect.util.TreeRegressionChecks'
}
check.dependsOn treeRegressionChecks
test.dependsOn treeRegressionChecks

tasks.register('chunkUpdateRegressionChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'net.oxcodsnet.roadarchitect.util.ChunkUpdateRegressionChecks'
}
check.dependsOn chunkUpdateRegressionChecks
test.dependsOn chunkUpdateRegressionChecks
